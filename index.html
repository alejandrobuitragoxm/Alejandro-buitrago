  <body class="bg-[#08080a] text-zinc-100 antialiased overflow-x-hidden">
    <!-- Brief cinematic intro curtain; fades out once the app is ready -->
    <div id="intro-curtain"><span class="intro-mark">Alejandro Buitrago</span></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // The hero video decides when to lift the intro curtain (see HeroReel).
      // This is only a safety net: if the video never becomes ready, reveal the
      // page after a max wait so it can never get stuck on the intro.
      (function () {
        setTimeout(function () {
          var c = document.getElementById('intro-curtain');
          if (c) {
            c.classList.add('hide');
            setTimeout(function () { c.remove(); }, 1200);
          }
        }, 12000);
      })();
    </script>
  </body>
